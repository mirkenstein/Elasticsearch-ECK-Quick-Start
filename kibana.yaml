apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: quickstart
spec:
  version: 8.17.2
  http:
    service:
      spec:
        type: NodePort
        ports:
          - name: https
            nodePort: 30885
            port: 5601
            protocol: TCP
            targetPort: 5601
  count: 1
  elasticsearchRef:
    name: quickstart
  #  enterpriseSearchRef:
  #    name: enterprise-search-quickstart
  #  confid:
  #    enterpriseSearch:
  #      host: 'https://enterprise-search-quickstart-ent-http.elk.svc:3002'
  config:
    server.publicBaseUrl: "https://192.168.49.2:30885/"
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: quickstart
    logs:
      elasticsearchRefs:
        - name: quickstart